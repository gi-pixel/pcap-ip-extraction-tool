[project]
name = "pcapscope"
version = "0.1.0"
description = "Stream a pcap/pcapng file and report unique IP addresses with per-IP stats."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["dpkt>=1.9.8"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
enrich-offline = ["geoip2>=4.8"]

[project.scripts]
pcapscope = "pcapscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]